# SonarCloud configuration for j2xml
# https://sonarcloud.io/dashboard?id=gundestrup_j2xml

sonar.organization=gundestrup
sonar.projectKey=gundestrup_j2xml

sonar.projectName=j2xml
# The release/CI command supplies sonar.projectVersion from VERSION.

# Source directories
sonar.sources=.

# Exclude vendored, generated, and test-only paths from analysis
sonar.exclusions=**/media/**,**/build/**,**/tests/**,**/vendor/**,**/node_modules/**,**/stubs/**,**/*.min.js,**/*.pack.js

# Language-specific settings
sonar.php.exclusions=**/vendor/**
sonar.javascript.exclusions=**/media/**,**/build/**,**/node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8
