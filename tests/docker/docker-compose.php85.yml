services:
  joomla5:
    image: j2xml-joomla5-php85
    pull_policy: build
    build:
      # The Dockerfile copies only --from the Joomla source-image stage, so a
      # minimal context keeps the build fast on Docker Desktop.
      context: .
      dockerfile: Dockerfile.php85
      args:
        JOOMLA_SOURCE_IMAGE: joomla:5.4.8-php8.3-apache

  joomla6:
    image: j2xml-joomla6-php85
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.php85
      args:
        JOOMLA_SOURCE_IMAGE: joomla:6.1.3-php8.4-apache
