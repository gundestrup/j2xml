# Codecov configuration for j2xml
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 10%
        informational: true

comment:
  layout: "condensed_header, diff, flags, components, files"
  require_changes: false
  require_base: false
  require_head: true

# Exclude vendored and generated paths from coverage
ignore:
  - "media/**"
  - "build/**"
  - "tests/**"
  - "vendor/**"
  - "node_modules/**"
  - "stubs/**"
  - "**/*.min.js"
  - "**/*.pack.js"
