name: J2XML CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,mbstring,xml,zip
          coverage: pcov
      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Validate release metadata
        run: bash scripts/release-check.sh --metadata-only
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.php' -z | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover coverage.xml
      - name: Stage coverage artifact
        if: always()
        run: cp coverage.xml coverage-phpunit-${{ matrix.php }}.xml 2>/dev/null || echo "No unit coverage produced"
      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-phpunit-${{ matrix.php }}
          path: coverage-phpunit-${{ matrix.php }}.xml
          if-no-files-found: warn
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './tests ./scripts'
          severity: warning
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: XML validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            # This fixture is intentionally malformed for import rejection tests.
            [[ "$file" = "tests/fixtures/malformed.xml" ]] && continue
            xmllint --noout "$file"
          done < <(git ls-files '*.xml' -z)

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Semgrep
        run: |
          pip3 install --only-binary :all: "semgrep==1.176.0"
      - name: Run Semgrep security scan
        run: semgrep scan --config .semgrep.yml --error libraries/ plugins/ administrator/ api/ cli/

  mysql-integration:
    name: Joomla 5/6 MySQL integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install zip for build script
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Start Joomla and MySQL containers
        run: docker compose -f tests/docker/docker-compose.yml up -d mysql joomla5 joomla6
      - name: Enable coverage collection
        continue-on-error: true
        run: bash tests/scripts/coverage-enable.sh j2xml-joomla5 http://localhost:8085 j2xml-joomla6 http://localhost:8086
      - name: Run Joomla integration suite
        run: bash tests/scripts/run-all-tests.sh
      - name: Collect integration coverage
        if: always()
        continue-on-error: true
        run: bash tests/scripts/coverage-collect.sh coverage-integration-mysql.xml j2xml-joomla5 j2xml-joomla6
      - name: Upload integration coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-integration-mysql
          path: coverage-integration-mysql.xml
          if-no-files-found: warn
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down -v

  postgresql-integration:
    name: Joomla 5/6 PostgreSQL smoke integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install zip for build script
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Start Joomla and PostgreSQL containers
        run: docker compose -f tests/docker/docker-compose.postgresql.yml up -d
      - name: Enable coverage collection
        continue-on-error: true
        run: bash tests/scripts/coverage-enable.sh j2xml-joomla5-pg http://localhost:8185 j2xml-joomla6-pg http://localhost:8186
      - name: Run full PostgreSQL integration suite
        env:
          DB_DRIVER: pgsql
          DB_PG_CONTAINER: j2xml-postgres
          J5_CONTAINER: j2xml-joomla5-pg
          J6_CONTAINER: j2xml-joomla6-pg
          JOOMLA5_URL: http://localhost:8185
          JOOMLA6_URL: http://localhost:8186
        run: bash tests/scripts/run-all-tests.sh
      - name: Collect integration coverage
        if: always()
        continue-on-error: true
        run: bash tests/scripts/coverage-collect.sh coverage-integration-postgresql.xml j2xml-joomla5-pg j2xml-joomla6-pg
      - name: Upload integration coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-integration-postgresql
          path: coverage-integration-postgresql.xml
          if-no-files-found: warn
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml down -v

  coverage:
    name: Merge and upload coverage
    runs-on: ubuntu-latest
    needs: [php-quality, mysql-integration, postgresql-integration]
    if: always()
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Download coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true
      - name: Merge coverage reports
        run: |
          shopt -s nullglob
          files=(coverage-reports/*.xml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No coverage reports found; skipping merge"
            exit 0
          fi
          php tests/scripts/merge-clover.php coverage-combined.xml coverage-reports
      - name: Upload coverage to Codecov
        if: hashFiles('coverage-combined.xml') != ''
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage-combined.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
