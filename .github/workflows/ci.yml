name: J2XML CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,mbstring,xml,zip
          coverage: pcov
      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.php' -z | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './tests ./scripts'
          severity: warning
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: XML validation
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.xml' -z | xargs -0 -n1 xmllint --noout

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Semgrep
        run: |
          pip3 install --only-binary :all: "semgrep==1.176.0"
      - name: Run Semgrep security scan
        run: semgrep scan --config .semgrep.yml --error libraries/ plugins/ components/ administrator/ cli/

  mysql-integration:
    name: Joomla 5/6 MySQL integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install zip for build script
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Start Joomla and MySQL containers
        run: docker compose -f tests/docker/docker-compose.yml up -d mysql joomla5 joomla6
      - name: Run Joomla integration suite
        run: bash tests/scripts/run-all-tests.sh
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down -v

  postgresql-integration:
    name: Joomla 5/6 PostgreSQL smoke integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install zip for build script
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Start Joomla and PostgreSQL containers
        run: docker compose -f tests/docker/docker-compose.postgresql.yml up -d
      - name: Run PostgreSQL integration smoke tests
        run: bash tests/scripts/run-postgresql-smoke.sh
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml down -v
