name: J2XML CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,mbstring,xml,zip
          coverage: none
      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.php' -z | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './tests ./scripts'
          severity: warning
      - name: XML validation
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.xml' -z | xargs -0 -n1 xmllint --noout

  mysql-integration:
    name: Joomla 5/6 MySQL integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@v4
      - name: Start official Joomla images with MySQL
        run: docker compose -f tests/docker/docker-compose.yml up -d
      - name: Run Joomla integration suite
        run: bash tests/scripts/run-all-tests.sh
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down -v

  postgresql-integration:
    name: Joomla 5/6 PostgreSQL smoke integration
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@v4
      - name: Start official Joomla images with PostgreSQL
        run: docker compose -f tests/docker/docker-compose.postgresql.yml up -d
      - name: Run PostgreSQL integration smoke tests
        run: bash tests/scripts/run-postgresql-smoke.sh
      - name: Collect container logs
        if: failure()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml logs --no-color
      - name: Stop test environment
        if: always()
        run: docker compose -f tests/docker/docker-compose.postgresql.yml down -v
